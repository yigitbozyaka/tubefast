name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: RELEASE_NOTES.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum tubefast-windows-x64.zip tubefast.exe tubefast-macos-universal.zip tubefast-linux-x64 tubefast-linux-x64.tar.gz Tubefast-x86_64.AppImage > SHA256SUMS.txt
          gh release create ${{ github.ref_name }} * --title "Tubefast ${{ github.ref_name }}" --notes-file ../RELEASE_NOTES.md --generate-notes
