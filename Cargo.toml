[package]
name = "tubefast"
version = "0.3.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "YouTube Music, native and fast. A lightweight desktop client with no browser engine."
repository = "https://github.com/yigitbozyaka/tubefast"
keywords = ["youtube-music", "music", "player", "egui", "desktop"]
categories = ["multimedia::audio"]

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland", "x11"] }
egui-phosphor = { version = "0.11", default-features = false, features = ["regular", "fill"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
memmap2 = "0.9"
ring = "0.17"
rodio = { version = "0.21", default-features = false, features = ["playback"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4"] }
ureq = { version = "2", features = ["json"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.61", features = ["Foundation", "Media", "Win32_Foundation", "Win32_System_WinRT"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Security_Cryptography", "Win32_System_Console"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSData", "NSDictionary", "NSGeometry", "NSString", "NSValue"] }
objc2-media-player = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "MPMediaItem", "MPNowPlayingInfoCenter", "MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
async-channel = "2"
futures-lite = "2"
mpris-server = "0.10"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
